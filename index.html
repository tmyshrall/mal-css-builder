<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAL CSS Builder</title>
  <style>
/* ===== Builder UI: cream, minimal ===== */
:root {
  --bg: #faf6ee; --card: #fffdf8; --line: #e8e1d2;
  --text: #2b2a27; --dim: #8c867b; --accent: #2f8f85; --ink: #2b2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
.site-head, main { max-width: 1900px; margin: 0 auto; padding: 0 20px; }
.site-head { padding-top: 40px; }
.site-head h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 600; letter-spacing: -.3px; }
.site-head p { margin: 0 0 28px; color: var(--dim); font-size: .92rem; }
main { padding-bottom: 56px; }

/* workspace: controls on the left, preview stays pinned on the right */
.workspace { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 32px; }
.workspace .block { margin-bottom: 0; }
.preview-block { position: sticky; top: 16px; z-index: 20; }
.preview-block .stage { min-height: 0; overflow-y: auto; border-radius: 0; transform-origin: 0 0; }
.stage-wrap { position: relative; overflow: hidden; border-radius: 14px; background: #e6eaee; }
@media (max-width: 860px) {
  .workspace { grid-template-columns: 1fr; gap: 16px; }
  .preview-block { order: -1; top: 0; padding: 8px 0; background: var(--bg); }
}

/* controls */
.controls { display: grid; grid-template-columns: 1fr; gap: 16px; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
details.group { padding: 0; }
details.group > summary { display: flex; justify-content: space-between; align-items: center; list-style: none; cursor: pointer; padding: 14px 18px; font-size: .7rem; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; user-select: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after { content: "+"; font-size: 1rem; letter-spacing: 0; }
details.group[open] > summary::after { content: "\2013"; }
details.group[open] > summary { padding-bottom: 6px; }
.gbody { padding: 6px 18px 8px; }
@media (min-width: 861px) { .controls { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; } }
.group h3 { margin: 0 0 14px; font-size: .7rem; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; }
.ctl { margin-bottom: 12px; font-size: .8rem; color: var(--dim); }
.ctl label { display: block; }
.ctl label span { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; margin: 14px 0 6px; background: var(--line); border-radius: 2px; outline: none; cursor: pointer; }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; transition: transform .15s; }
.ctl input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; transition: transform .15s; }
.ctl input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
.ctl input[type=range]:hover::-webkit-slider-thumb, .ctl input[type=range]:focus::-webkit-slider-thumb { transform: scale(1.25); }
.ctl input[type=range]:hover::-moz-range-thumb, .ctl input[type=range]:focus::-moz-range-thumb { transform: scale(1.25); }
.ctl input[type=text], .ctl select { width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.ctl.color { display: flex; align-items: center; justify-content: space-between; }
.ctl.color input { width: 36px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
.ctl.check label { display: flex; align-items: center; gap: 9px; color: var(--text); cursor: pointer; }
.ctl.check input { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 14px; height: 14px; margin: 0; border: 1px solid #bdb6a6; border-radius: 3px; background: transparent; cursor: pointer; transition: background .15s, border-color .15s; }
.ctl.check input:checked { background: var(--ink); border-color: var(--ink); }
.ctl.check input:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }

/* blocks */
.block { margin-bottom: 32px; }
.block-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.block-head h2 { margin: 0; font-size: .7rem; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; }
.upload { font-size: .78rem; color: var(--dim); }
.upload input { margin-left: 6px; color: var(--dim); font-size: .78rem; }
.btns { display: flex; gap: 8px; }
button { background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 8px; padding: 7px 14px; font: inherit; font-size: .8rem; cursor: pointer; transition: background .15s, color .15s; }
button:hover { background: var(--ink); color: var(--bg); }
button.ghost { color: var(--dim); border-color: var(--line); }
button.ghost:hover { background: var(--line); color: var(--text); }
.imp textarea { width: 100%; min-height: 130px; resize: vertical; margin: 6px 0 10px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: .72rem/1.5 ui-monospace, Menlo, Consolas, monospace; }
.imp .impmsg { margin: 8px 0 4px; font-size: .78rem; color: var(--dim); min-height: 1em; }
.imp .btns { margin-bottom: 4px; }
pre { margin: 0; max-height: 420px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; font-size: .74rem; line-height: 1.6; color: #4a483f; }

/* ===== Sample list (structure only; the generated CSS does the theming) ===== */
.stage {
  position: relative; z-index: 0; isolation: isolate; overflow: hidden;
  min-height: 520px; padding: 22px 18px; border-radius: 14px;
  background: linear-gradient(135deg, #ffffff, #e6eaee) center / cover no-repeat;
  font-family: arial, sans-serif; font-size: 13px; color: #dcdcdc;
}
.stage a { color: inherit; text-decoration: none; cursor: pointer; }
.stage .status-menu-container { margin-bottom: 14px; border: 1px solid rgba(255,255,255,.12); }
.stage .status-menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
.stage .status-button { padding: 4px 14px; color: #e6e6e6; }
.stage .list-block { padding: 12px; border: 1px solid rgba(255,255,255,.12); }
.stage .list-status-title { padding: 8px; text-align: center; font-size: 17px; font-weight: 700; }
.stage .list-table { width: 100%; margin-top: 6px; border-collapse: collapse; }
.stage .list-table td { padding: 7px 6px; text-align: center; vertical-align: middle; }
.stage .list-table td.title { text-align: left; font-weight: 600; }
.stage .list-table td.status { width: 4px; padding: 0; }
.stage .list-table td.status.completed { background: #2e51a2; }
.stage .list-table td.title .title-wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stage .list-table-header td { font-size: 12px; font-weight: 700; }
.stage .list-table-header td.title { text-align: left; }
.stage .list-table-header .link.sort { color: inherit; }
.stage .data.image img { display: block; width: 38px; height: 54px; margin: 0 auto; }
.stage .score-label { display: inline-block; font-weight: 600; }
.stage .edit { flex: none; margin-left: auto; font-size: 10px; opacity: .8; white-space: nowrap; }
.stage .status-menu-container, .stage .list-block { max-width: 1060px; margin-left: auto; margin-right: auto; }
.stage .status-menu-container { margin-bottom: 14px; }

/* default placeholder text across the sample background (hidden once you add an image) */
.stage .stage-wm {
  position: absolute; left: 50%; top: 50%; z-index: -1;
  transform: translate(-50%, -50%) rotate(-28deg);
  font: 700 clamp(34px, 8vw, 84px) system-ui, sans-serif; letter-spacing: .12em; white-space: nowrap;
  color: rgba(0,0,0,.07); pointer-events: none; user-select: none;
}
.stage.has-bg .stage-wm { display: none; }
  </style>
</head>
<body>
  <header class="site-head">
    <h1>MAL CSS Builder</h1>
    <p>Tweak the controls, watch the sample list change, then copy the CSS into your MyAnimeList style box.</p>
  </header>

  <main>
    <!-- 1. Controls (built by app.js) -->
    <div class="workspace">
    <section id="controls" class="controls"></section>

    <!-- 2. Live preview (sticky) -->
    <section class="block preview-block">
      <div class="block-head">
        <h2>Preview</h2>
        <label class="upload">Upload a background to preview
          <input type="file" id="bgfile" accept="image/*">
        </label>
      </div>
      <div class="stage-wrap" id="stagewrap"><div class="stage" id="stage">
        <div class="stage-wm">SAMPLE BACKGROUND</div>
        <div class="side-l"></div><div class="side-r"></div>
        <div class="status-menu-container">
          <div class="status-menu">
            <a class="status-button">All Anime</a>
            <a class="status-button">Currently Watching</a>
            <a class="status-button on">Completed</a>
            <a class="status-button">On Hold</a>
            <a class="status-button">Dropped</a>
          </div>
        </div>
        <div class="list-block">
          <div class="list-unit">
            <div class="list-status-title"><span class="text">COMPLETED</span></div>
            <table class="list-table" id="table"></table>
          </div>
        </div>
      </div></div>
    </section>
    </div>

    <!-- 3. Generated CSS -->
    <section class="block">
      <div class="block-head">
        <h2>Your CSS</h2>
        <div class="btns">
          <button type="button" id="copy">Copy CSS</button>
          <button type="button" id="download">Download .css</button>
          <button type="button" id="reset" class="ghost">Reset</button>
        </div>
      </div>
      <pre id="code"></pre>
    </section>
  </main>

  <style id="gen"></style>
  <script>
/* MAL CSS Builder: controls -> CSS generator -> live preview */

const FONTS = ["Arial","Poppins","Nunito","Quicksand","Montserrat","Outfit","Lexend","Comfortaa","Fredoka","Josefin Sans","Rajdhani","Orbitron"];
const HFONTS = ["Same as main"].concat(FONTS);

/* Score palettes, lowest score (1) to highest (10) */
const PALETTES = {
  "Green to red": ["#d61f1f","#ff3b30","#ff6a1a","#ff8c1a","#ffb300","#ffd60a","#d4e84a","#8be36a","#3fcf5f","#11a84a"],
  "Cool blues":   ["#5b6cff","#5b7bff","#5b8cff","#5b9eff","#4fb0ff","#45c2ff","#3dd2ff","#40e0d0","#5af0c0","#7dffb0"],
  "Warm sunset":  ["#7a1f5c","#a1285f","#c8325a","#e04a50","#f26a43","#f98a3a","#fca937","#fdc43a","#ffd95a","#fff08a"],
  "Pastel":       ["#ff9aa2","#ffb18f","#ffc98b","#ffe08c","#fff09a","#e2f0a0","#c2eaa8","#a4e3bd","#98dbd6","#a9c8f5"],
  "Grayscale":    ["#6b6b6b","#7a7a7a","#8a8a8a","#9a9a9a","#aaaaaa","#bbbbbb","#cccccc","#dddddd","#eeeeee","#ffffff"],
  "Rainbow":      ["#ff3b30","#ff6a1a","#ffb300","#ffd60a","#8be36a","#3fcf5f","#1fb5c9","#3a7bff","#7a4bff","#c24bff"]
};
const PAL_NAMES = Object.keys(PALETTES).concat(["Accent shades"]);

/* Control definitions.
   range:  [key, "range", label, min, max, step, default]
   color:  [key, "color", label, default]
   check:  [key, "check", label, default]
   select: [key, "select", label, options, default]
   text:   [key, "text",  label, default]
   Every new option defaults to "off / unchanged", so untouched controls add nothing to the CSS. */
const SCHEMA = [
  { g: "Panels", open: true, i: [
    ["po","range","Panel opacity",0.2,1,0.01,0.65],
    ["pb","range","Panel blur (px)",0,10,0.5,3],
    ["psat","range","Glass color saturation",1,2,0.05,1],
    ["rad","range","Corner roundness (px)",0,30,1,14],
    ["bor","range","Panel border opacity",0,0.6,0.01,0.12],
    ["sh","range","Floating shadow",0,0.7,0.01,0.4],
    ["gl","range","Accent glow",0,0.8,0.01,0.32],
    ["eh","range","Edge highlight",0,0.8,0.01,0.6],
    ["es","range","Edge shadow",0,0.8,0.01,0.6],
    ["hop","range","Header bar opacity",0.2,1,0.01,0.6],
    ["hh","range","Category bar thickness (px, 0 = default)",0,30,1,0] ]},
  { g: "Colors", open: true, i: [
    ["acc","color","Accent color","#40e0d0"],
    ["pan","color","Panel tint","#081824"],
    ["h1","color","Header gradient start","#1fb5c9"],
    ["h2","color","Header gradient middle","#40e0d0"],
    ["h3","color","Header gradient end","#6cc04a"],
    ["txt","color","Title text color","#ffffff"],
    ["hdr","color","Column header text color","#ffffff"],
    ["btc","color","Body text color","#dcdcdc"],
    ["ctc","color","Category title color","#ffffff"],
    ["tabc","color","Tab text color","#e6e6e6"] ]},
  { g: "Panel fill & texture", i: [
    ["pgrad","check","Gradient panel fill",false],
    ["pan2","color","Gradient end color","#1a0f2e"],
    ["pang","range","Gradient angle (deg)",0,360,5,160],
    ["scan","check","Scanlines",false],
    ["grain","check","Dotted grain",false],
    ["outl","check","Accent outline on panels",false] ]},
  { g: "Rows & covers", i: [
    ["lift","range","Row hover lift (px)",0,10,1,2],
    ["slide","range","Row hover slide (px)",0,20,1,4],
    ["hov","range","Row hover darkness",0,0.7,0.01,0.4],
    ["div","range","Divider strength",0,0.4,0.01,0.1],
    ["sc","range","Cover zoom on hover",1,1.8,0.01,1.3],
    ["rot","range","Cover tilt (degrees)",0,10,0.5,3],
    ["cs","range","Cover shadow",0,1,0.01,0.6],
    ["crad","range","Cover roundness (px)",0,20,1,8] ]},
  { g: "Covers: extras", i: [
    ["csz","range","Cover width (px, 0 = default)",0,120,1,0],
    ["cglow","range","Cover glow",0,1,0.01,0],
    ["cbord","check","Cover border",false],
    ["cbc","color","Cover border color","#ffffff"],
    ["cbw","range","Cover border width (px)",1,5,1,2],
    ["gray","check","Black & white covers (color on hover)",false],
    ["cbr","range","Cover brightness",0.5,1.5,0.05,1] ]},
  { g: "Rows: extras", i: [
    ["rp","range","Row padding (px, 0 = default)",0,20,1,0],
    ["zebra","check","Zebra-striped rows",false],
    ["tint","check","Tint rows by score (high green, low red)",false],
    ["tinta","range","Tint strength",0.02,0.3,0.01,0.08],
    ["hovacc","check","Row hover uses accent color",false],
    ["focus","check","Dim other rows on hover",false],
    ["swi","range","Glint sweep brightness",0.02,0.3,0.01,0.07],
    ["sbar","check","Custom status bar (left edge)",false],
    ["sbc","color","Status bar color","#2e51a2"],
    ["sbw","range","Status bar width (px)",2,14,1,4],
    ["sbg","range","Status bar glow (px)",0,24,1,0],
    ["sticky","check","Sticky column headers",false],
    ["hbg","check","Column header row background",false],
    ["hbgc","color","Header row background color","#000000"],
    ["hbgo","range","Header row background opacity",0.05,1,0.01,0.35],
    ["hdv","range","Header divider strength",0,0.6,0.01,0.18] ]},
  { g: "Typography", i: [
    ["font","select","Main font",FONTS,"Poppins"],
    ["hfont","select","Heading font (headers, tabs, category)",HFONTS,"Same as main"],
    ["bts","range","Body text size (px, 0 = default)",0,24,1,0],
    ["ts","range","Title size (px, 0 = default)",0,28,1,0],
    ["hts","range","Column header size (px, 0 = default)",0,22,1,0],
    ["tls","range","Title letter spacing (px)",0,3,0.1,0],
    ["cts","range","Category title spacing (px)",0,10,0.5,1],
    ["ssz","range","Score size (px, 0 = default)",0,28,1,0],
    ["tsh","range","Text shadow strength",0,1,0.01,0.8],
    ["upper","check","UPPERCASE titles",false],
    ["uph","check","UPPERCASE column headers",false],
    ["neon","check","Neon glow on titles",false],
    ["lhc","check","Custom link hover color",false],
    ["lhcol","color","Link hover color","#ffffff"] ]},
  { g: "Scores", i: [
    ["pal","select","Score palette",PAL_NAMES,"Green to red"],
    ["scores","check","Colored scores",true],
    ["glow10","check","Glowing 10s",true],
    ["sglow","check","Glow on all scores",false],
    ["spill","check","Score pills",false] ]},
  { g: "Hide columns", i: [
    ["hNum","check","Hide # column",false],
    ["hImg","check","Hide cover images",false],
    ["hType","check","Hide Type",false],
    ["hProg","check","Hide Progress",false],
    ["hPrem","check","Hide Premiered",false],
    ["hMal","check","Hide MAL Score",false],
    ["hEdit","check","Hide Edit - More links",false] ]},
  { g: "Page & background", i: [
    ["bg","text","Background image URL (optional)",""],
    ["bgsize","select","Background size",["cover","contain","auto 100%","100% auto"],"cover"],
    ["bgpos","select","Background position",["Default","center","top","bottom","left","right"],"Default"],
    ["bgblur","range","Background blur (px)",0,20,0.5,0],
    ["bgsat","range","Background saturation",0,2,0.05,1],
    ["bghue","range","Background hue shift (deg)",0,360,5,0],
    ["dim","range","Background dim",0,0.8,0.01,0],
    ["vg","range","Vignette strength",0,0.7,0.01,0.15],
    ["vig","check","Vignette",true] ]},
  { g: "Side images", i: [
    ["simgL","text","Left image URL (may look blank in preview, still works on MAL)",""],
    ["simgR","text","Right image URL (optional, same note)",""],
    ["sameR","check","Use left image on right (mirrored) if right is empty",false],
    ["sw","range","Image width (px)",60,600,10,240],
    ["sgap","range","Distance from screen edge (px)",0,200,2,0],
    ["sfit","select","Image fit",["contain","cover"],"contain"],
    ["svp","select","Vertical position",["center","top","bottom"],"center"],
    ["sop","range","Image opacity",0.1,1,0.01,1],
    ["sfade","range","Image shadow glow",0,1,0.01,0],
    ["shide","check","Hide on narrow screens (under 1200px)",true] ]},
  { g: "Animation", i: [
    ["fade","check","Panel fade-in on load",true],
    ["pulse","check","Pulsing glow",true],
    ["ps","range","Pulse period (s)",2,20,0.5,6],
    ["shimmer","check","Shimmering header bar",false],
    ["shp","range","Shimmer period (s)",2,20,0.5,8],
    ["rainbow","check","Rainbow color-cycling header bar",false],
    ["rbp","range","Rainbow period (s)",3,40,1,12],
    ["sweep","check","Glint sweep on row hover",true],
    ["tilt","check","Cover enlarges on row hover",true],
    ["alt","check","Alternate tilt direction",true] ]},
  { g: "Effects", i: [
    ["bevel","check","Beveled glass edges",true],
    ["shadow","check","Floating shadows",true],
    ["pills","check","Pill-style category tabs",true],
    ["tabhl","range","Tab highlight strength",0.1,0.8,0.01,0.35],
    ["divs","check","Row dividers",true],
    ["hdiv","check","Column header dividers",true],
    ["bar","check","Accent bar on row hover",true],
    ["scroll","check","Themed scrollbar",false],
    ["sel","check","Accent text selection",false] ]}
];

const hx = h => [1,3,5].map(i => parseInt(h.substr(i,2),16)).join(",");
const n = x => +(+x).toFixed(2);
const mix = (h,p) => "#" + [1,3,5].map(i => { const v = parseInt(h.substr(i,2),16); return Math.round(v + (255 - v) * p).toString(16).padStart(2,"0"); }).join("");
const fam = f => f === "Arial" ? "arial, sans-serif" : "'" + f + "', arial, sans-serif";
const gfont = f => `@import url('https://fonts.googleapis.com/css2?family=${f.replace(/ /g,"+")}:wght@400;700&display=swap');`;
const palette = s => s.pal === "Accent shades" ? Array.from({ length: 10 }, (_, i) => mix(s.acc, i * 0.06)) : (PALETTES[s.pal] || PALETTES["Green to red"]);

/* s = settings object, o = preview overrides (body selector, positioning) */
function build(s, o) {
  o = o || {};
  const B = o.body || "body", pos = o.pos || "fixed", att = o.att || "fixed";
  const root = o.body ? o.body + " " : "";
  const P = hx(s.pan), A = hx(s.acc);
  const hSame = s.hfont === "Same as main";
  const ffMain = fam(s.font), ffHead = hSame ? ffMain : fam(s.hfont);
  const hi = n(s.gl), lo = n(s.gl * 0.375);
  const layers = s.shadow
    ? `0 2px 4px rgba(0,0,0,${n(s.sh)}),\n      0 10px 20px rgba(0,0,0,${n(s.sh)}),\n      0 24px 48px rgba(0,0,0,${n(s.sh*1.18)}),\n      ` : "";
  const boxS = (blur, a) => `${layers}0 0 ${blur}px rgba(${A},${a}),\n      inset 0 1px 0 rgba(255,255,255,.18)`;
  const anims = [];
  if (s.fade) anims.push("fadeUp .8s ease both");
  if (s.pulse) anims.push(`glowPulse ${n(s.ps)}s ease-in-out infinite`);
  const c = [];

  if (s.font !== "Arial") c.push(gfont(s.font));
  if (!hSame && s.hfont !== "Arial" && s.hfont !== s.font) c.push(gfont(s.hfont));

  /* ---------- PAGE ---------- */
  c.push("/* ===== PAGE ===== */");
  if (s.bg) c.push(`${B} {\n  background-image: url("${s.bg.replace(/[\r\n\\]/g,"").replace(/"/g,"%22")}") !important;\n  background-size: ${s.bgsize} !important;${s.bgpos !== "Default" ? `\n  background-position: ${s.bgpos} !important;` : ""}\n  background-attachment: ${att} !important;\n}`);
  if (s.bgblur > 0 || s.bgsat !== 1 || s.bghue > 0) {
    const f = [];

  $("table").innerHTML =
    `<thead><tr class="list-table-header"><td class="header-title status"></td><td class="header-title number"><a class="link">#</a></td><td class="header-title image"><a class="link sort">Image</a></td><td class="header-title title"><a class="link sort">Anime Title</a></td><td class="header-title score"><a class="link sort">Score</a></td><td class="header-title type"><a class="link sort">Type</a></td><td class="header-title progress"><a class="link sort">Progress</a></td><td class="header-title release"><a class="link sort">Premiered</a></td><td class="header-title mal"><a class="link sort">MAL Score</a></td></tr></thead>` +
    rows.map((r, i) => `<tbody class="list-item"><tr class="list-table-data"><td class="data status completed"></td><td class="data number">${i+1}</td><td class="data image"><a><img src="${art(covers[i])}" alt=""></a></td><td class="data title"><div class="title-wrap"><a class="link">${r[0]}</a><span class="edit">Edit - More</span></div></td><td class="data score"><span class="score-label score-${r[1]}">${r[1]}</span></td><td class="data type">${r[2]}</td><td class="data progress">${r[3]}</td><td class="data release">${r[4]}</td><td class="data mal">${r[5]}</td></tr></tbody>`).join("");

  /* ----- buttons ----- */
  function copyText(txt, b, label) {
    const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = label, 1200); };
    const fb = () => { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); };
    try { navigator.clipboard.writeText(txt).then(done, fb); } catch (x) { fb(); }
  }

  $("bgfile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => { uploaded = rd.result; refresh(); }; rd.readAsDataURL(f);
  });
  $("copy").addEventListener("click", e => copyText($("code").textContent, e.target, "Copy CSS"));
  $("download").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([$("code").textContent], { type: "text/css" }));
    a.download = "mal-style.css"; a.click();
  });
  $("reset").addEventListener("click", () => {
    uploaded = ""; $("bgfile").value = "";
    setState({}, true);
  });

  refresh();
}

if (typeof module !== "undefined") module.exports = { build, SCHEMA, parseCss, PALETTES };
  </script>
</body>
</html>
